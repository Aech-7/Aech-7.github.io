<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ripple Checkerboard</title>
<style>
  :root { --bg:#fdf3e1; --hint:#5b87b3; box-sizing:border-box; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#fdf3e1; --hint:#5b87b3; } }
  :root[data-theme="dark"] { --bg:#fdf3e1; --hint:#5b87b3; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
  .hint { position:fixed; left:0; right:0; bottom:0; padding:0 16px calc(18px + env(safe-area-inset-bottom, 0px)); text-align:center;
    font:500 13px/1.3 system-ui, sans-serif; letter-spacing:.04em; color:var(--hint); pointer-events:none; transition:opacity 1s; }
  .hint span { background:rgba(253,243,225,.85); padding:6px 12px; border-radius:999px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint"><span>move your cursor · click or tap for a big ripple</span></div>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2');
if (!gl) { document.getElementById('hint').firstChild.textContent = 'WebGL2 is not supported in this browser.'; }
else {
const N = 24;
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const fs = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uT; uniform vec2 uMouse; uniform float uVel; uniform vec4 uR[${N}];
out vec4 o;
const vec3 BLUE = vec3(0.573,0.773,0.925);
const vec3 CREAM = vec3(0.992,0.953,0.882);
const vec3 DARK = vec3(0.13,0.28,0.50);
const vec3 WHITE = vec3(0.94,0.98,1.0);
void main(){
  float a = uRes.x/uRes.y;
  vec2 uv = gl_FragCoord.xy/uRes;
  vec2 sp = vec2((uv.x-0.5)*a, uv.y);
  vec2 disp = vec2(0.);
  for(int i=0;i<${N};i++){
    vec4 r = uR[i];
    vec2 dv = sp - r.xy; float d = length(dv);
    float age = uT - r.z;
    float f = d - age*0.5;
    float w = sin(f*34.) * exp(-f*f*14.) * exp(-age*1.6) * r.w / (1.+d*2.5);
    disp += (dv/(d+1e-4)) * w * 0.014;
  }
  vec2 dm = sp - uMouse;
  disp -= dm * exp(-dot(dm,dm)*9.) * (0.04 + 0.08*uVel);
  vec2 s2 = sp + disp;
  vec2 q = vec2(s2.x*14.0 + uT*0.2, s2.y*14.0);
  // rounded tiles in a checkerboard
  vec2 cell = floor(q);
  vec2 u = fract(q) - 0.5;
  float r = 0.26;
  vec2 e = max(abs(u) - (0.5 - r), 0.);
  float sd = length(e) - r;
  float aa = max(length(fwidth(q))*0.8, 0.01);
  float tile = 1. - smoothstep(-aa, aa, sd);
  float tpar = mod(cell.x + cell.y, 2.);
  vec3 tileCol = mix(BLUE, CREAM, tpar);
  // exposed corner gaps: colour alternates per junction (dark / white) -> illusory diagonal waves
  vec2 jn = floor(q + 0.5);
  const float SEQ[8] = float[8](0.,1.,0.,0.,1.,0.,1.,1.); // dark,white,dark,dark | white,dark,white,white
  float jpar = SEQ[int(mod(jn.x + jn.y, 8.) + 0.5) % 8]; // depends on i+j: constant along each diagonal
  vec3 gapCol = mix(DARK, WHITE, jpar);
  vec3 col = mix(gapCol, tileCol, tile);
  o = vec4(col, 1.);
}`;
function sh(t,s){ const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(x)); return x; }
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(pr); gl.useProgram(pr);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U = n => gl.getUniformLocation(pr,n);
const uRes=U('uRes'), uT=U('uT'), uMouse=U('uMouse'), uVel=U('uVel'), uR=U('uR');

const ripples = new Float32Array(N*4); for(let i=0;i<N;i++) ripples[i*4+2] = -100;
let ri = 0, t0 = performance.now();
const now = () => (performance.now()-t0)/1000;
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr;
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize', resize); resize();

const toSpace = (x,y) => [(x/innerWidth-0.5)*(innerWidth/innerHeight), 1-y/innerHeight];
function spawn(x,y,s){ const [sx,sy]=toSpace(x,y); ripples.set([sx,sy,now(),s], ri*4); ri=(ri+1)%N; }

let target=[0,0.4], mouse=[0,0.4], vel=0, last=null, acc=0, hintHidden=false;
function move(x,y){
  target = toSpace(x,y);
  if(last){
    const d = Math.hypot(x-last[0], y-last[1]);
    vel = Math.min(1, vel + d/120);
    acc += d;
    if(acc > 38){ spawn(x,y, 0.3 + Math.min(d/60, 0.5)); acc = 0; }
  }
  last = [x,y];
  if(!hintHidden){ hintHidden=true; document.getElementById('hint').style.opacity = 0; }
}
canvas.addEventListener('pointermove', e => move(e.clientX, e.clientY));
canvas.addEventListener('pointerdown', e => { move(e.clientX, e.clientY); spawn(e.clientX, e.clientY, 1.2); });
canvas.addEventListener('pointerleave', () => { last = null; });

// intro ripple
setTimeout(() => spawn(innerWidth*0.5, innerHeight*0.55, 1.0), 200);

function frame(){
  const t = now();
  mouse[0] += (target[0]-mouse[0])*0.15; mouse[1] += (target[1]-mouse[1])*0.15;
  vel *= 0.93;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uT, t);
  gl.uniform2f(uMouse, mouse[0], mouse[1]);
  gl.uniform1f(uVel, vel);
  gl.uniform4fv(uR, ripples);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
frame();
}
</script>
</body>
</html>
